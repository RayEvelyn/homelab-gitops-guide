# Reviewed administrator bootstrap only; do not run this in the CI deploy job.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-agent-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-agent
  namespace: gitlab-agent-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-deployer
  namespace: demo
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-agent-configmaps
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: lab-agent
    namespace: gitlab-agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-deployer
# No Secret, deletion, RBAC, workload or cluster-admin authority.
# Installation/bootstrap requires its own administrator identity and is separate.
